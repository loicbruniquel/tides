<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tides</title>
    <meta name="description" content="Tide graphs and times for any coastal location" />

    <!-- `viewport-fit=cover` + the safe-area padding in main.css keeps the layout clear
         of the iOS notch and home indicator when installed to the home screen. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />

    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />

    <!-- iOS home-screen install -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tides" />
    <link rel="apple-touch-icon" href="/icons/apple-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-icon-167x167.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#38e5b0" />

    <!-- Apply the stored theme before first paint, otherwise a dark-mode user gets a
         white flash while the app boots. Must stay in sync with src/stores/settings.ts. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('tides.theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* private mode / storage disabled — fall back to the light palette */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

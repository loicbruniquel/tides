[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA history-mode fallback. `public/_redirects` carries the same rule so it also
# applies to `netlify deploy` runs that skip this file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served stale, or clients pin themselves to an
# old precache manifest and stop receiving updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
